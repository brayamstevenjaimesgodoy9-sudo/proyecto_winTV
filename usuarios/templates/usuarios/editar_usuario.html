<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>
</head>
<body>

    <h1>Editar usuario</h1>

    <p>
        Usuario:
        <strong>{{ usuario.username }}</strong>
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar cambios
        </button>
    </form>

    <p>
        <a href="{% url 'listar_usuarios' %}">
            Volver a la lista
        </a>
    </p>

</body>
</html>
