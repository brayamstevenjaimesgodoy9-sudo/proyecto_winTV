<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}WinTV - Ventas{% endblock %}</title>
  <!-- Plantilla provisional: se reemplaza por la plantilla base de Alex (TT-03) -->
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #0b4f8a; color: #fff; padding: 12px 24px; }
    header a { color: #fff; margin-right: 16px; text-decoration: none; }
    main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
    .msg { padding: 10px; background: #e6f4ea; border: 1px solid #9bd3ae; margin-bottom: 16px; }
    .msg.error { background: #fdecea; border-color: #f5a8a0; }
    .estado { padding: 2px 8px; border-radius: 10px; font-size: 13px; font-weight: bold; }
    .estado-ACTIVO { background: #e6f4ea; color: #1e6b34; }
    .estado-SUSPENDIDO { background: #fff4e0; color: #8a5300; }
    .estado-CANCELADO { background: #fdecea; color: #a1271b; }
    .errorlist { color: #b00020; margin: 4px 0; padding-left: 18px; }
    .btn { background: #0b4f8a; color: #fff; padding: 8px 14px; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; }
    form p { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    select, input { padding: 6px; min-width: 280px; }
  </style>
</head>
<body>
  <header>
    <strong>WinTV</strong> &nbsp;|&nbsp;
    <a href="{% url 'servicios:contrato_lista' %}">Contratos</a>
    <a href="{% url 'servicios:contrato_nuevo' %}">Registrar contrato</a>
  </header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
