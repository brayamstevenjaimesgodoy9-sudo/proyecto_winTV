{% extends "servicios/base.html" %}{% block contenido %}<h2>Contratos</h2><a href="{% url 'servicios:contrato_nuevo' %}">Nuevo contrato</a><table><tr><th>Código</th><th>Cliente</th><th>Plan</th><th>Estado</th></tr>{% for c in contratos %}<tr><td><a href="{% url 'servicios:contrato_detalle' c.pk %}">{{ c.codigo }}</a></td><td>{{ c.cliente }}</td><td>{{ c.plan.nombre }}</td><td>{{ c.get_estado_display }}</td></tr>{% empty %}<tr><td colspan="4">Sin contratos</td></tr>{% endfor %}</table>{% endblock %}
